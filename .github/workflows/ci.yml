name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 需要 Node 内置的 zstd 解压和 SQLite（22.15+）
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # 真正打包、安装、运行一次 CLI，防止发布包漏文件
      - run: npm run check:pack

  browser:
    # 页面层的冒烟检查：示例数据、软件渲染。像素级的视觉回归依赖真实显卡，只在本机运行（scripts/visual.mjs）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: check:browser
        run: |
          npx vite --port 5199 --strictPort &
          for i in $(seq 1 60); do curl -sf http://localhost:5199/ > /dev/null && break; sleep 1; done
          npm run check:browser
      - run: npm run build:site
      - run: npm run check:site
