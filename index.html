<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <title>Agent Badges</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <i class="star brand-mark" aria-hidden="true"></i>
        <nav class="brand-tabs" data-brands data-i18n-aria="nav.brands"></nav>
        <span class="brand-sub label" data-i18n="app.sub"></span>
      </div>
      <div class="topbar-right">
        <span class="source label" data-source></span>
        <nav class="seg lang-seg" data-lang-switch></nav>
      </div>
    </header>

    <main class="wall" id="wall">
      <div id="profile-slot"></div>
      <div id="heat-slot"></div>
      <div class="wall-bar">
        <h2 class="section-title" data-wall-title></h2>
        <div class="seg wall-filter" role="radiogroup" data-filter></div>
      </div>
      <div id="series"></div>
      <p class="wall-empty" data-wall-empty hidden></p>
      <footer class="colophon">
        <div class="rule has-star"><i class="star"></i></div>
        <p class="colophon-line label">
          <span>Agent Badges</span><span aria-hidden="true">·</span><span data-version></span><span aria-hidden="true">·</span><a href="https://github.com/Aryous/agent-badges" target="_blank" rel="noopener">GitHub</a>
        </p>
      </footer>
    </main>

    <!-- 分享海报 -->
    <div class="modal" id="poster" role="dialog" aria-modal="true" aria-labelledby="poster-title" hidden>
      <div class="modal-card">
        <header class="modal-head">
          <h2 class="modal-title" id="poster-title" data-poster-title></h2>
          <button class="btn-icon" type="button" data-poster-close>
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </header>
        <div class="poster-preview" data-poster-preview></div>
        <footer class="modal-foot">
          <button class="btn btn-primary" type="button" data-poster-download disabled></button>
        </footer>
      </div>
    </div>

    <!-- GitHub 主页徽章图 -->
    <div class="modal" id="shelf" role="dialog" aria-modal="true" aria-labelledby="shelf-title" hidden>
      <div class="modal-card modal-wide">
        <header class="modal-head">
          <h2 class="modal-title" id="shelf-title" data-shelf-title></h2>
          <button class="btn-icon" type="button" data-shelf-close>
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </header>
        <div class="poster-preview shelf-preview" data-shelf-preview></div>
        <footer class="modal-foot shelf-foot">
          <p class="shelf-status" data-shelf-status aria-live="polite"></p>
          <button class="btn btn-primary" type="button" data-shelf-download disabled></button>
        </footer>
      </div>
    </div>

    <!-- 单枚查看：全屏遮罩，实时 3D 只在这里渲染 -->
    <div class="overlay" id="overlay" hidden>
    <div class="export-frame" id="export-frame" data-bg="transparent" aria-hidden="true"></div>
    <canvas id="stage" data-i18n-aria="inspect.stage"></canvas>
    <!-- 静止时的超采样画面，叠在 3D 画布上方（不接收鼠标，拖动仍落在 3D 画布上） -->
    <canvas id="stage-accum" aria-hidden="true"></canvas>
    <section class="inspector" id="inspector" aria-live="polite">
      <button class="btn-back" data-close type="button" data-i18n-aria="inspect.backAria">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="inspect.back"></span>
      </button>

      <div class="info">
        <p class="kicker" data-kicker></p>
        <h1 class="title" data-title></h1>
        <p class="title-en" data-title-en></p>
        <p class="desc" data-desc></p>
        <ol class="tier-ladder" data-tiers hidden></ol>
        <div class="meter" data-meter hidden>
          <div class="meter-track"><div class="meter-fill" data-meter-fill></div></div>
          <span class="meter-text" data-meter-text></span>
        </div>
        <div class="actions">
          <button class="btn" data-replay type="button" data-i18n="inspect.replay"></button>
          <div class="export">
            <button class="btn btn-primary" data-export-toggle type="button" aria-expanded="false" aria-controls="export-panel" data-i18n="export.open"></button>
            <div class="export-panel" id="export-panel" role="dialog" data-i18n-aria="export.open" hidden>
              <div class="panel-row">
                <span class="panel-label label" data-i18n="export.bg"></span>
                <div class="seg" role="radiogroup" data-i18n-aria="export.bgAria">
                  <button type="button" role="radio" aria-checked="true" data-bg="transparent"><span class="swatch" aria-hidden="true"></span><span data-i18n="export.transparent"></span></button>
                  <button type="button" role="radio" aria-checked="false" data-bg="ink"><span class="swatch" aria-hidden="true"></span><span data-i18n="export.ink"></span></button>
                </div>
              </div>
              <div class="panel-row">
                <span class="panel-label label" data-i18n="export.face"></span>
                <span class="panel-value" data-export-face></span>
              </div>
              <div class="panel-row">
                <span class="panel-label label" data-i18n="export.size"></span>
                <span class="panel-value">2048 × 2048 PNG</span>
              </div>
              <button class="btn btn-primary btn-block" data-export type="button" data-i18n="export.download"></button>
            </div>
          </div>
        </div>
        <p class="hint" data-hint data-i18n="inspect.hint"></p>
      </div>
    </section>
    </div>

    <div class="notice" id="notice" role="alert" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
