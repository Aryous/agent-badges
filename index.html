<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23C9A36A'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23D97757'/%3E%3Cpath d='M10 12l5 4-5 4M17 21h6' stroke='%23F0EEE6' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
    <title>Claude Code 成就徽章</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <nav class="brand-tabs" data-brands aria-label="切换品牌"></nav>
        <span class="brand-sub">成就徽章</span>
      </div>
      <div class="topbar-right">
        <span class="source" data-source></span>
        <div class="tally" data-tally></div>
      </div>
    </header>

    <main class="wall" id="wall" aria-label="徽章陈列墙"></main>

    <!-- 单枚查看：全屏遮罩，实时 3D 只在这里渲染 -->
    <div class="overlay" id="overlay" hidden>
    <div class="export-frame" id="export-frame" data-bg="transparent" aria-hidden="true"></div>
    <canvas id="stage" aria-label="3D 徽章，可拖动旋转"></canvas>
    <section class="inspector" id="inspector" aria-live="polite">
      <button class="btn-back" data-close type="button" aria-label="返回陈列墙">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        全部徽章
      </button>

      <div class="info">
        <p class="kicker" data-kicker></p>
        <h1 class="title" data-title></h1>
        <p class="title-en" data-title-en></p>
        <p class="desc" data-desc></p>
        <ol class="tier-ladder" data-tiers hidden></ol>
        <div class="meter" data-meter hidden>
          <div class="meter-track"><div class="meter-fill" data-meter-fill></div></div>
          <span class="meter-text" data-meter-text></span>
        </div>
        <div class="actions">
          <button class="btn" data-replay type="button">重播动画</button>
          <div class="export">
            <button class="btn btn-primary" data-export-toggle type="button" aria-expanded="false" aria-controls="export-panel">导出图片</button>
            <div class="export-panel" id="export-panel" role="dialog" aria-label="导出图片" hidden>
              <div class="panel-row">
                <span class="panel-label">背景</span>
                <div class="seg" role="radiogroup" aria-label="导出背景">
                  <button type="button" role="radio" aria-checked="true" data-bg="transparent"><span class="swatch" aria-hidden="true"></span>透明</button>
                  <button type="button" role="radio" aria-checked="false" data-bg="ink"><span class="swatch" aria-hidden="true"></span>墨色</button>
                </div>
              </div>
              <div class="panel-row">
                <span class="panel-label">朝向</span>
                <span class="panel-value" data-export-face>正面</span>
              </div>
              <div class="panel-row">
                <span class="panel-label">尺寸</span>
                <span class="panel-value">2048 × 2048 PNG</span>
              </div>
              <button class="btn btn-primary btn-block" data-export type="button">下载 PNG</button>
            </div>
          </div>
        </div>
        <p class="hint" data-hint>左右拖动旋转 · 翻到背面看刻字</p>
      </div>
    </section>
    </div>

    <div class="notice" id="notice" role="alert" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
