<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23C9A36A'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23D97757'/%3E%3Cpath d='M10 12l5 4-5 4M17 21h6' stroke='%23F0EEE6' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
    <title>Claude Code 成就徽章</title>
  </head>
  <body>
    <canvas id="stage" aria-label="3D 徽章展示区"></canvas>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name" data-brand-name>Claude Code</span>
        <span class="brand-sub">成就徽章</span>
      </div>
      <div class="tally" data-tally></div>
    </header>

    <div class="labels" id="labels"></div>

    <section class="inspector" id="inspector" hidden aria-live="polite">
      <button class="btn-back" data-close type="button" aria-label="返回陈列墙">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        全部徽章
      </button>

      <div class="info">
        <p class="kicker" data-kicker></p>
        <h1 class="title" data-title></h1>
        <p class="title-en" data-title-en></p>
        <p class="desc" data-desc></p>
        <div class="meter" data-meter hidden>
          <div class="meter-track"><div class="meter-fill" data-meter-fill></div></div>
          <span class="meter-text" data-meter-text></span>
        </div>
        <div class="actions">
          <button class="btn" data-replay type="button">重播动画</button>
          <div class="export">
            <div class="seg" role="radiogroup" aria-label="导出背景">
              <button type="button" role="radio" aria-checked="true" data-bg="transparent">透明</button>
              <button type="button" role="radio" aria-checked="false" data-bg="ink">墨色</button>
            </div>
            <button class="btn btn-primary" data-export type="button">导出 PNG</button>
          </div>
        </div>
        <p class="hint" data-hint>左右拖动旋转 · 翻到背面看刻字</p>
      </div>
    </section>

    <div class="notice" id="notice" role="alert" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
